<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Vista previa del enlace · Lectura diaria de la Biblia</title>
<link rel="stylesheet" href="estilo.css">
<style>
  /* 1200×630: la imagen que muestran WhatsApp, Facebook y Telegram al compartir el enlace */
  body { width: 1200px; height: 630px; }
  .text { position: absolute; left: 70px; top: 64px; width: 640px; }
  .brand img { width: 84px; height: 84px; }
  .brand strong { font-size: 32px; }
  .brand span { font-size: 22px; }
  .headline { font-size: 72px; margin-top: 40px; }
  .sub { font-size: 30px; margin-top: 18px; }
  .url { position: absolute; left: 70px; bottom: 60px; font-size: 34px; padding: 14px 32px; }
  .free { position: absolute; left: 380px; bottom: 76px; font-size: 26px; display: none; }
  .phone { position: absolute; width: 640px; zoom: 0.62; right: 20px; top: 70px; transform: rotate(5deg); }
</style>
</head>
<body>
<div class="stars"></div>
<div class="text">
  <div class="brand">
    <img src="../icons/icon-512x512.png" alt="">
    <div><strong>Lectura diaria</strong><span>de la Biblia</span></div>
  </div>
  <h1 class="headline">Lee la Biblia <em>completa</em> en un año</h1>
  <p class="sub">Gratis · Sin registro · Funciona sin conexión</p>
</div>

<div class="phone">
  <div class="screen">
    <div class="m-header"><small>Hoy</small><b>Lectura diaria</b></div>
    <div class="m-body">
      <div class="m-card">
        <p class="m-eyebrow">📖 Lectura de hoy</p>
        <span class="m-day">Día 1</span>
        <p class="m-reading">Génesis 1-3</p>
        <span class="m-btn">📖 Ver lectura</span><span class="m-btn m-btn--ok">✓ Leído</span>
      </div>
      <div class="m-week"><span class="ico">🗓️</span><div><small>Lectura de la semana</small><b>Mateo 5-7</b></div><span class="ok">✓ Leída</span></div>
    </div>
  </div>
</div>

<span class="url">mylectura.mycongre.com</span>
</body>
</html>
